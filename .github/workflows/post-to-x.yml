name: Post to X
on:
  schedule:
    - cron: "37 13 * * 1-5"   # ~9:37am ET  (+ 0-40m jitter)
    - cron: "52 16 * * 1-5"   # ~12:52pm ET (+ 0-40m jitter)
    - cron: "19 19 * * 1-5"   # ~3:19pm ET  (+ 0-40m jitter)
    - cron: "8 15 * * 6,0"    # weekend late-morning ET
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Human-like jitter
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 2400))   # 0-40 min random delay
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Post next queued item
        env:
          POST_LIVE: ${{ secrets.POST_LIVE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/post_to_x.py
      - name: Record what was posted
        run: |
          git config user.name "monkeystocks-bot"
          git config user.email "actions@github.com"
          git add cards/posted_log.json
          git diff --cached --quiet || git commit -m "Log posted tweet"
          git pull --rebase --autostash origin main || true
          git push || true
